name: Deploy Aeon-MLTB-ZX Bot to Heroku

on:
  workflow_dispatch:
    inputs:
      HEROKU_APP_NAME:
        description: "Heroku App name"
        required: true
      HEROKU_API_KEY:
        description: "Heroku API key"
        required: true
      HEROKU_EMAIL:
        description: "Heroku email address"
        required: true
      BOT_TOKEN:
        description: "Telegram bot token"
        required: true
      OWNER_ID:
        description: "Owner's telegram ID"
        required: true
      DATABASE_URL:
        description: "Database URL from MongoDB"
        required: true
      TELEGRAM_API:
        description: "Telegram API ID"
        required: true
      TELEGRAM_HASH:
        description: "Telegram HASH"
        required: true
      UPSTREAM_REPO:
        description: "Upstream Repo"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy Branch
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Set Heroku Stack
        run: |
          heroku stack:set heroku-26 --app ${{inputs.HEROKU_APP_NAME}}
        env:
          HEROKU_API_KEY: ${{inputs.HEROKU_API_KEY}}

      - name: Deploy Repo to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{inputs.HEROKU_API_KEY}}
          heroku_app_name: ${{inputs.HEROKU_APP_NAME}}
          heroku_email: ${{inputs.HEROKU_EMAIL}}
          usedocker: false
          stack: "heroku-26"
          region: "eu"
        env:
          HD_OWNER_ID: ${{inputs.OWNER_ID}}
          HD_TELEGRAM_API: ${{inputs.TELEGRAM_API}}
          HD_TELEGRAM_HASH: ${{inputs.TELEGRAM_HASH}}
          HD_DATABASE_URL: ${{inputs.DATABASE_URL}}
          HD_BOT_TOKEN: ${{inputs.BOT_TOKEN}}
          HD_UPSTREAM_REPO: ${{inputs.UPSTREAM_REPO}}
          OWNER_ID: ${{inputs.OWNER_ID}}
          TELEGRAM_API: ${{inputs.TELEGRAM_API}}
          TELEGRAM_HASH: ${{inputs.TELEGRAM_HASH}}
          DATABASE_URL: ${{inputs.DATABASE_URL}}
          BOT_TOKEN: ${{inputs.BOT_TOKEN}}
          UPSTREAM_REPO: ${{inputs.UPSTREAM_REPO}}
